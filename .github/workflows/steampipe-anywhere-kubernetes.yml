name: Steampipe Anywhere Components (Kubernetes)

# Component pinning
# -----------------
# This workflow statically links the plugin into a fixed bundle of
# steampipe-export, steampipe-sqlite, and steampipe-osquery. Each of
# those is pinned below to a specific commit SHA (the trailing comment is
# the tag or branch the SHA was taken from). The pinning is intentional:
# every plugin release that ships through Anywhere is built against the
# exact same export/sqlite/osquery the customer-side runtime expects, so
# the bundle stays reproducible across re-runs.
#
# Coordination requirement: an SDK major-version bump on the plugin (e.g.
# steampipe-plugin-sdk/v5 -> /v6) requires a matching ref-bump PR here.
# Static linking fails to compile when the plugin's SDK major version
# diverges from the export/sqlite/osquery pinned below. Merging the SDK
# bump to plugin main does NOT flow into this workflow on its own - the
# pinned SHAs must be updated to commits that carry the new SDK major.
#
# This is the kubernetes-specific variant of steampipe-anywhere.yml; it
# skips the postgres FDW builds and additionally builds the osquery
# extension.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release (must be prefixed with 'v')"
        required: true

  workflow_call:

permissions:
  contents: write

env:
  # Darwin builds otherwise take the runner's macOS version as their minimum,
  # so builds on macOS 15 runners would not load on macOS 14.
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  # The Go version the Go builds use: the setup-go steps below, and the
  # goreleaser-cross image below, which must ship the same Go (each
  # cross-compile job checks). Update the two together.
  GO_VERSION: "1.26.10"
  # The Darwin SQLite extensions are cross-compiled on Linux in this image:
  # goreleaser-cross v1.26.10. Multi-arch index digest.
  GORELEASER_CROSS_IMAGE: ghcr.io/goreleaser/goreleaser-cross@sha256:4ddb0de02f2eaac64d2b33e16d1d702d800db6a110154f8768f283858fb26c02

jobs:
  get-version:
    name: Get Version
    runs-on: ubuntu-latest
    steps:
      - name: Check out steampipe-export
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: "turbot/steampipe-export"
          ref: 676528ebf7121cb6096a744ee7dece6d92638065 # develop (SDK v6)

      - name: Set environment variables
        run: |
          plugin_name=$(echo $GITHUB_REPOSITORY | cut -d'-' -f 3)
          echo $plugin_name
          echo "PLUGIN_NAME=${plugin_name}" >> $GITHUB_ENV
          echo "PLUGIN_GITHUB_URL=github.com/turbot/steampipe-plugin-${plugin_name}" >> $GITHUB_ENV

      - name: Get latest version tag
        run: |-
          echo "VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
          echo "Version: ${VERSION}"

      - name: If workflow_dispatch, get version from input
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi
          echo "Version: ${VERSION}"

      - name: Setup GoLang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Fetch plugin module
        run: |
          # Extract major version if present (e.g. v2 from v2.0.1)
          MAJOR_VERSION=$(echo $VERSION | grep -o '^v[0-9]\+' || echo "v1")
          # v0 and v1 don't need version in path, v2+ do
          if [ "$MAJOR_VERSION" = "v1" ] || [ "$MAJOR_VERSION" = "v0" ]; then
            go get github.com/turbot/steampipe-plugin-${{ env.PLUGIN_NAME }}@$VERSION
          else
            go get github.com/turbot/steampipe-plugin-${{ env.PLUGIN_NAME }}/${MAJOR_VERSION}@$VERSION
          fi

  build-sqlite-extension-linux-amd64:
    name: Build SQLite Extension for Linux - AMD64
    needs: get-version
    runs-on: ubuntu-latest

    steps:
      - name: Check architecture
        run: uname -a

      - name: Set environment variables
        run: |
          plugin_name=$(echo $GITHUB_REPOSITORY | cut -d'-' -f 3)
          echo $plugin_name
          echo "PLUGIN_NAME=${plugin_name}" >> $GITHUB_ENV
          echo "PLUGIN_GITHUB_URL=github.com/turbot/steampipe-plugin-${plugin_name}" >> $GITHUB_ENV

      - name: Check out steampipe-sqlite-extension
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: "turbot/steampipe-sqlite"
          ref: f7d95f6ab8ed26740e1a0420f0aa71439f257841 # develop (SDK v6)

      - name: If workflow_dispatch, get version from input
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi
          echo "Version: ${VERSION}"

      - name: Setup GoLang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build steampipe-sqlite-extension
        run: |
          pwd
          ls -ltr
          make build plugin=${{ env.PLUGIN_NAME }} plugin_version=${{ env.VERSION }} plugin_github_url=${{ env.PLUGIN_GITHUB_URL }}
          ls -ltr

      - name: Zip and rename the steampipe_sqlite_${{ env.PLUGIN_NAME }}.so
        run: |-
          tar -czvf steampipe_sqlite_${{ env.PLUGIN_NAME }}.linux_amd64.tar.gz steampipe_sqlite_${{ env.PLUGIN_NAME }}.so

      - name: Save Linux Build Artifact - AMD64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: steampipe_sqlite_${{ env.PLUGIN_NAME }}.linux_amd64.tar.gz
          path: steampipe_sqlite_${{ env.PLUGIN_NAME }}.linux_amd64.tar.gz
          if-no-files-found: error

  build-sqlite-extension-linux-arm64:
    name: Build SQLite Extension for Linux - ARM64
    needs: get-version
    runs-on:
      group: linux-arm64-runners

    steps:
      - name: Check architecture
        run: uname -a

      - name: Set environment variables
        run: |
          plugin_name=$(echo $GITHUB_REPOSITORY | cut -d'-' -f 3)
          echo $plugin_name
          echo "PLUGIN_NAME=${plugin_name}" >> $GITHUB_ENV
          echo "PLUGIN_GITHUB_URL=github.com/turbot/steampipe-plugin-${plugin_name}" >> $GITHUB_ENV

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Check out steampipe-sqlite-extension
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: "turbot/steampipe-sqlite"
          ref: f7d95f6ab8ed26740e1a0420f0aa71439f257841 # develop (SDK v6)

      - name: If workflow_dispatch, get version from input
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi
          echo "Version: ${VERSION}"

      - name: Build steampipe-sqlite-extension
        run: |
          pwd
          ls -ltr
          make build plugin=${{ env.PLUGIN_NAME }} plugin_version=${{ env.VERSION }} plugin_github_url=${{ env.PLUGIN_GITHUB_URL }}
          ls -ltr

      - name: Zip and rename the steampipe_sqlite_${{ env.PLUGIN_NAME }}.so
        run: |-
          tar -czvf steampipe_sqlite_${{ env.PLUGIN_NAME }}.linux_arm64.tar.gz steampipe_sqlite_${{ env.PLUGIN_NAME }}.so

      - name: Save Linux Build Artifact - ARM64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: steampipe_sqlite_${{ env.PLUGIN_NAME }}.linux_arm64.tar.gz
          path: steampipe_sqlite_${{ env.PLUGIN_NAME }}.linux_arm64.tar.gz
          if-no-files-found: error

  build-sqlite-extension-osx-amd64:
    name: Build SQLite Extension for Darwin - AMD64
    needs: get-version
    # Cross-compiled on Linux, which keeps the build off the org's 5 concurrent
    # macOS jobs. The install checks below load it on a Mac.
    runs-on: ubuntu-latest
    # It runs a third-party build image, and only uploads an artifact.
    permissions:
      contents: read

    steps:
      - name: Set environment variables
        run: |
          plugin_name=$(echo $GITHUB_REPOSITORY | cut -d'-' -f 3)
          echo $plugin_name
          echo "PLUGIN_NAME=${plugin_name}" >> $GITHUB_ENV
          echo "PLUGIN_GITHUB_URL=github.com/turbot/steampipe-plugin-${plugin_name}" >> $GITHUB_ENV

      - name: Check out steampipe-sqlite-extension
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: "turbot/steampipe-sqlite"
          ref: f7d95f6ab8ed26740e1a0420f0aa71439f257841 # develop (SDK v6)

      - name: If workflow_dispatch, get version from input
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi
          echo "Version: ${VERSION}"

      # goreleaser-cross is about 18 GB unpacked. Remove SDKs the containerised
      # build doesn't use, as the Tailpipe plugin builds do
      # (turbot/steampipe-hub-actions).
      - name: Free disk space on the root volume
        run: |-
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Pull goreleaser-cross
        run: docker pull --quiet "$GORELEASER_CROSS_IMAGE"

      # The build must use the same Go as the workflow's other Go builds.
      - name: Check the build image's Go version
        run: |-
          image_go=$(docker run --rm --entrypoint go "$GORELEASER_CROSS_IMAGE" env GOVERSION)
          echo "goreleaser-cross has $image_go; GO_VERSION is $GO_VERSION"
          if [ "$image_go" != "go$GO_VERSION" ]; then
            echo "::error::goreleaser-cross has $image_go, not go$GO_VERSION. Update GORELEASER_CROSS_IMAGE and GO_VERSION together."
            exit 1
          fi

      - name: Build steampipe-sqlite-extension
        run: |-
          # The Go caches and temp files go on the runner's larger /mnt disk.
          sudo mkdir -p /mnt/go/cache /mnt/go/modcache /mnt/go/tmp /mnt/go/home
          sudo chown -R "$(id -u):$(id -g)" /mnt/go
          # Run as the runner's user: as root, git refuses the runner-owned
          # checkout ("dubious ownership") and Go's VCS stamping fails the build.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/mnt-go/home \
            -e GOOS=darwin \
            -e GOARCH=amd64 \
            -e CGO_ENABLED=1 \
            -e CC=o64-clang \
            -e MACOSX_DEPLOYMENT_TARGET \
            -e GOCACHE=/mnt-go/cache \
            -e GOMODCACHE=/mnt-go/modcache \
            -e GOTMPDIR=/mnt-go/tmp \
            -e TMPDIR=/mnt-go/tmp \
            -v "$PWD:/src" \
            -v /mnt/go:/mnt-go \
            -w /src \
            --entrypoint make \
            "$GORELEASER_CROSS_IMAGE" \
            build plugin="$PLUGIN_NAME" plugin_version="$VERSION" plugin_github_url="$PLUGIN_GITHUB_URL"
          ls -ltr

      - name: Check the extension's architecture and minimum macOS version
        run: |-
          docker run --rm \
            -e MACOSX_DEPLOYMENT_TARGET \
            -v "$PWD:/src:ro" \
            --entrypoint bash \
            "$GORELEASER_CROSS_IMAGE" \
            -c '
              set -euo pipefail
              so="/src/steampipe_sqlite_$0.so"
              want="Mach-O 64-bit x86_64 dynamically linked shared library"
              desc=$(file "$so")
              echo "$desc"
              [[ "$desc" == *"$want"* ]] || { echo "::error::expected $want"; exit 1; }
              headers=$(llvm-objdump --macho --private-headers "$so")
              minos=$(echo "$headers" | awk "/cmd LC_BUILD_VERSION/ {f=1} f && !m && \$1 == \"minos\" {print \$2; m=1}")
              echo "minos: $minos"
              [ "$minos" = "$MACOSX_DEPLOYMENT_TARGET" ] || { echo "::error::minos is $minos, expected $MACOSX_DEPLOYMENT_TARGET"; exit 1; }
            ' "$PLUGIN_NAME"

      - name: Zip and rename the steampipe_sqlite_${{ env.PLUGIN_NAME }}.so
        run: |-
          tar -czvf steampipe_sqlite_${{ env.PLUGIN_NAME }}.darwin_amd64.tar.gz steampipe_sqlite_${{ env.PLUGIN_NAME }}.so

      - name: Save Darwin Build Artifact - AMD64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: steampipe_sqlite_${{ env.PLUGIN_NAME }}.darwin_amd64.tar.gz
          path: steampipe_sqlite_${{ env.PLUGIN_NAME }}.darwin_amd64.tar.gz
          if-no-files-found: error

  build-sqlite-extension-osx-arm64:
    name: Build SQLite Extension for Darwin - ARM64
    needs: get-version
    # Cross-compiled on Linux, which keeps the build off the org's 5 concurrent
    # macOS jobs. The install checks below load it on a Mac.
    runs-on: ubuntu-latest
    # It runs a third-party build image, and only uploads an artifact.
    permissions:
      contents: read

    steps:
      - name: Set environment variables
        run: |
          plugin_name=$(echo $GITHUB_REPOSITORY | cut -d'-' -f 3)
          echo $plugin_name
          echo "PLUGIN_NAME=${plugin_name}" >> $GITHUB_ENV
          echo "PLUGIN_GITHUB_URL=github.com/turbot/steampipe-plugin-${plugin_name}" >> $GITHUB_ENV

      - name: Check out steampipe-sqlite-extension
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: "turbot/steampipe-sqlite"
          ref: f7d95f6ab8ed26740e1a0420f0aa71439f257841 # develop (SDK v6)

      - name: If workflow_dispatch, get version from input
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi
          echo "Version: ${VERSION}"

      # goreleaser-cross is about 18 GB unpacked. Remove SDKs the containerised
      # build doesn't use, as the Tailpipe plugin builds do
      # (turbot/steampipe-hub-actions).
      - name: Free disk space on the root volume
        run: |-
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Pull goreleaser-cross
        run: docker pull --quiet "$GORELEASER_CROSS_IMAGE"

      # The build must use the same Go as the workflow's other Go builds.
      - name: Check the build image's Go version
        run: |-
          image_go=$(docker run --rm --entrypoint go "$GORELEASER_CROSS_IMAGE" env GOVERSION)
          echo "goreleaser-cross has $image_go; GO_VERSION is $GO_VERSION"
          if [ "$image_go" != "go$GO_VERSION" ]; then
            echo "::error::goreleaser-cross has $image_go, not go$GO_VERSION. Update GORELEASER_CROSS_IMAGE and GO_VERSION together."
            exit 1
          fi

      - name: Build steampipe-sqlite-extension
        run: |-
          # The Go caches and temp files go on the runner's larger /mnt disk.
          sudo mkdir -p /mnt/go/cache /mnt/go/modcache /mnt/go/tmp /mnt/go/home
          sudo chown -R "$(id -u):$(id -g)" /mnt/go
          # Run as the runner's user: as root, git refuses the runner-owned
          # checkout ("dubious ownership") and Go's VCS stamping fails the build.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/mnt-go/home \
            -e GOOS=darwin \
            -e GOARCH=arm64 \
            -e CGO_ENABLED=1 \
            -e CC=oa64-clang \
            -e MACOSX_DEPLOYMENT_TARGET \
            -e GOCACHE=/mnt-go/cache \
            -e GOMODCACHE=/mnt-go/modcache \
            -e GOTMPDIR=/mnt-go/tmp \
            -e TMPDIR=/mnt-go/tmp \
            -v "$PWD:/src" \
            -v /mnt/go:/mnt-go \
            -w /src \
            --entrypoint make \
            "$GORELEASER_CROSS_IMAGE" \
            build plugin="$PLUGIN_NAME" plugin_version="$VERSION" plugin_github_url="$PLUGIN_GITHUB_URL"
          ls -ltr

      - name: Check the extension's architecture, minimum macOS version and signature
        run: |-
          docker run --rm \
            -e MACOSX_DEPLOYMENT_TARGET \
            -v "$PWD:/src:ro" \
            --entrypoint bash \
            "$GORELEASER_CROSS_IMAGE" \
            -c '
              set -euo pipefail
              so="/src/steampipe_sqlite_$0.so"
              want="Mach-O 64-bit arm64 dynamically linked shared library"
              desc=$(file "$so")
              echo "$desc"
              [[ "$desc" == *"$want"* ]] || { echo "::error::expected $want"; exit 1; }
              headers=$(llvm-objdump --macho --private-headers "$so")
              minos=$(echo "$headers" | awk "/cmd LC_BUILD_VERSION/ {f=1} f && !m && \$1 == \"minos\" {print \$2; m=1}")
              echo "minos: $minos"
              [ "$minos" = "$MACOSX_DEPLOYMENT_TARGET" ] || { echo "::error::minos is $minos, expected $MACOSX_DEPLOYMENT_TARGET"; exit 1; }
              # Apple Silicon only loads signed code; the linker ad-hoc signs
              # arm64 builds. The Darwin ARM64 install check verifies it.
              [[ "$headers" == *"cmd LC_CODE_SIGNATURE"* ]] || { echo "::error::no code signature"; exit 1; }
              echo "code signature: present"
            ' "$PLUGIN_NAME"

      - name: Zip and rename the steampipe_sqlite_${{ env.PLUGIN_NAME }}.so
        run: |-
          tar -czvf steampipe_sqlite_${{ env.PLUGIN_NAME }}.darwin_arm64.tar.gz steampipe_sqlite_${{ env.PLUGIN_NAME }}.so

      - name: Save Darwin Build Artifact - ARM64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: steampipe_sqlite_${{ env.PLUGIN_NAME }}.darwin_arm64.tar.gz
          path: steampipe_sqlite_${{ env.PLUGIN_NAME }}.darwin_arm64.tar.gz
          if-no-files-found: error

  build-export-tool:
    name: Build Export Tool
    needs: get-version
    runs-on: ubuntu-latest

    steps:
      - name: Set environment variables
        run: |
          plugin_name=$(echo $GITHUB_REPOSITORY | cut -d'-' -f 3)
          echo $plugin_name
          echo "PLUGIN_NAME=${plugin_name}" >> $GITHUB_ENV
          echo "PLUGIN_GITHUB_URL=github.com/turbot/steampipe-plugin-${plugin_name}" >> $GITHUB_ENV

      - name: Check out steampipe-export
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: "turbot/steampipe-export"
          ref: 676528ebf7121cb6096a744ee7dece6d92638065 # develop (SDK v6)

      - name: Get latest version tag
        run: |-
          echo "VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
          echo "Version: ${VERSION}"

      - name: If workflow_dispatch, get version from input
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi
          echo "Version: ${VERSION}"

      - name: Setup GoLang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build steampipe-export
        run: |
          pwd
          ls -ltr
          make release plugin=${{ env.PLUGIN_NAME }} plugin_version=${{ env.VERSION }} plugin_github_url=${{ env.PLUGIN_GITHUB_URL }}
          ls -ltr
          go mod tidy

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          install-only: true

      - name: Run GoReleaser
        run: |
          chmod +x scripts/release.sh
          ./scripts/release.sh

      - name: Copy the gzipped binaries from dist
        run: |-
          ls -al dist/
          cp dist/steampipe_export_${{ env.PLUGIN_NAME }}.linux_amd64.tar.gz steampipe_export_${{ env.PLUGIN_NAME }}.linux_amd64.tar.gz
          cp dist/steampipe_export_${{ env.PLUGIN_NAME }}.linux_arm64.tar.gz steampipe_export_${{ env.PLUGIN_NAME }}.linux_arm64.tar.gz
          cp dist/steampipe_export_${{ env.PLUGIN_NAME }}.darwin_amd64.tar.gz steampipe_export_${{ env.PLUGIN_NAME }}.darwin_amd64.tar.gz
          cp dist/steampipe_export_${{ env.PLUGIN_NAME }}.darwin_arm64.tar.gz steampipe_export_${{ env.PLUGIN_NAME }}.darwin_arm64.tar.gz
          ls -al

      - name: Save Linux Build Artifact - AMD64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: steampipe_export_${{ env.PLUGIN_NAME }}.linux_amd64.tar.gz
          path: steampipe_export_${{ env.PLUGIN_NAME }}.linux_amd64.tar.gz
          if-no-files-found: error

      - name: Save Linux Build Artifact - ARM64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: steampipe_export_${{ env.PLUGIN_NAME }}.linux_arm64.tar.gz
          path: steampipe_export_${{ env.PLUGIN_NAME }}.linux_arm64.tar.gz
          if-no-files-found: error

      - name: Save Darwin Build Artifact - AMD64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: steampipe_export_${{ env.PLUGIN_NAME }}.darwin_amd64.tar.gz
          path: steampipe_export_${{ env.PLUGIN_NAME }}.darwin_amd64.tar.gz
          if-no-files-found: error

      - name: Save Darwin Build Artifact - ARM64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: steampipe_export_${{ env.PLUGIN_NAME }}.darwin_arm64.tar.gz
          path: steampipe_export_${{ env.PLUGIN_NAME }}.darwin_arm64.tar.gz
          if-no-files-found: error

  build-osquery-extension:
    name: Build Osquery Extension
    needs: get-version
    runs-on: ubuntu-latest
    steps:
      - name: Set environment variables
        run: |
          plugin_name=$(echo $GITHUB_REPOSITORY | cut -d'-' -f 3)
          echo $plugin_name
          echo "PLUGIN_NAME=${plugin_name}" >> $GITHUB_ENV
          echo "PLUGIN_GITHUB_URL=github.com/turbot/steampipe-plugin-${plugin_name}" >> $GITHUB_ENV

      - name: Create steampipe-osquery reader token
        id: osquery-reader-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.STEAMPIPE_OSQUERY_READER_CLIENT_ID }}
          private-key: ${{ secrets.STEAMPIPE_OSQUERY_READER_PRIVATE_KEY }}
          owner: turbot
          repositories: steampipe-osquery

      - name: Check out steampipe-osquery
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: "turbot/steampipe-osquery"
          ref: be4e74b8b1364b52779c09c708cc50c47f01174f # develop (SDK v6, GoReleaser v2 config)
          token: ${{ steps.osquery-reader-token.outputs.token }}

      - name: If workflow_dispatch, get version from input
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi
          echo "Version: ${VERSION}"

      - name: Setup GoLang
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build steampipe-osquery
        run: |
          pwd
          ls -ltr
          make build plugin=${{ env.PLUGIN_NAME }} plugin_version=${{ env.VERSION }} plugin_github_url=${{ env.PLUGIN_GITHUB_URL }}
          ls -ltr
          go mod tidy

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --skip=publish --clean

      - name: Copy the gzipped binaries from dist
        run: |-
          ls -al dist/
          cp dist/steampipe_osquery_${{ env.PLUGIN_NAME }}.linux_amd64.tar.gz steampipe_osquery_${{ env.PLUGIN_NAME }}.linux_amd64.tar.gz
          cp dist/steampipe_osquery_${{ env.PLUGIN_NAME }}.linux_arm64.tar.gz steampipe_osquery_${{ env.PLUGIN_NAME }}.linux_arm64.tar.gz
          ls -al

      - name: Save Linux Build Artifact - AMD64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: steampipe_osquery_${{ env.PLUGIN_NAME }}.linux_amd64.tar.gz
          path: steampipe_osquery_${{ env.PLUGIN_NAME }}.linux_amd64.tar.gz
          if-no-files-found: error

      - name: Save Linux Build Artifact - ARM64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: steampipe_osquery_${{ env.PLUGIN_NAME }}.linux_arm64.tar.gz
          path: steampipe_osquery_${{ env.PLUGIN_NAME }}.linux_arm64.tar.gz
          if-no-files-found: error

  build-draft-release:
    name: Build Draft Release
    runs-on: ubuntu-latest
    needs:
      # SQLite
      - build-sqlite-extension-linux-amd64
      - build-sqlite-extension-linux-arm64
      - build-sqlite-extension-osx-amd64
      - build-sqlite-extension-osx-arm64
      # Export
      - build-export-tool
      # Osquery
      - build-osquery-extension
      # Darwin checks
      - check-darwin-arm64
      - check-darwin-amd64
    steps:
      - name: Set environment variables
        run: |
          plugin_name=$(echo $GITHUB_REPOSITORY | cut -d'-' -f 3)
          echo $plugin_name
          echo "PLUGIN_NAME=${plugin_name}" >> $GITHUB_ENV

      - name: Download steampipe_sqlite_${{ env.PLUGIN_NAME }}.linux_amd64.tar.gz
        id: download_sqlite_linux_amd64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: steampipe_sqlite_${{ env.PLUGIN_NAME }}.linux_amd64.tar.gz

      - name: Download steampipe_sqlite_${{ env.PLUGIN_NAME }}.linux_arm64.tar.gz
        id: download_sqlite_linux_arm64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: steampipe_sqlite_${{ env.PLUGIN_NAME }}.linux_arm64.tar.gz

      - name: Download steampipe_sqlite_${{ env.PLUGIN_NAME }}.darwin_amd64.tar.gz
        id: download_sqlite_darwin_amd64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: steampipe_sqlite_${{ env.PLUGIN_NAME }}.darwin_amd64.tar.gz

      - name: Download steampipe_sqlite_${{ env.PLUGIN_NAME }}.darwin_arm64.tar.gz
        id: download_sqlite_darwin_arm64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: steampipe_sqlite_${{ env.PLUGIN_NAME }}.darwin_arm64.tar.gz

      - name: Download steampipe_export_${{ env.PLUGIN_NAME }}.linux_amd64.tar.gz
        id: download_export_linux_amd64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: steampipe_export_${{ env.PLUGIN_NAME }}.linux_amd64.tar.gz

      - name: Download steampipe_export_${{ env.PLUGIN_NAME }}.linux_arm64.tar.gz
        id: download_export_linux_arm64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: steampipe_export_${{ env.PLUGIN_NAME }}.linux_arm64.tar.gz

      - name: Download steampipe_export_${{ env.PLUGIN_NAME }}.darwin_amd64.tar.gz
        id: download_export_darwin_amd64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: steampipe_export_${{ env.PLUGIN_NAME }}.darwin_amd64.tar.gz

      - name: Download steampipe_export_${{ env.PLUGIN_NAME }}.darwin_arm64.tar.gz
        id: download_export_darwin_arm64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: steampipe_export_${{ env.PLUGIN_NAME }}.darwin_arm64.tar.gz

      - name: Download steampipe_osquery_${{ env.PLUGIN_NAME }}.linux_amd64.tar.gz
        id: download_osquery_linux_amd64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: steampipe_osquery_${{ env.PLUGIN_NAME }}.linux_amd64.tar.gz

      - name: Download steampipe_osquery_${{ env.PLUGIN_NAME }}.linux_arm64.tar.gz
        id: download_osquery_linux_arm64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: steampipe_osquery_${{ env.PLUGIN_NAME }}.linux_arm64.tar.gz

      - name: Check Path
        run: |-
          ls -la

      - name: Get latest version tag
        run: |-
          echo "VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
          trim=${VERSION#"v"}
          echo $trim
          echo "VERSION=${trim}" >> $GITHUB_ENV

      - name: If workflow_dispatch, get version from input
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi
          echo "Version: ${VERSION}"

      - name: Check if pre-release
        id: check_prerelease
        run: |
          if [[ "${{ env.VERSION }}" =~ (alpha|beta|rc|dev) ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create a draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        id: create_draft_release
        with:
          draft: false
          # A published release is immutable, so fail before creating it if
          # any listed asset is missing.
          fail_on_unmatched_files: true
          prerelease: ${{ steps.check_prerelease.outputs.is_prerelease }}
          name: ${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
          repository: ${{ github.repository }}
          files: |-
            ${{ steps.download_sqlite_darwin_amd64.outputs.download-path }}/steampipe_sqlite_${{ env.PLUGIN_NAME }}.darwin_amd64.tar.gz
            ${{ steps.download_sqlite_darwin_arm64.outputs.download-path }}/steampipe_sqlite_${{ env.PLUGIN_NAME }}.darwin_arm64.tar.gz
            ${{ steps.download_sqlite_linux_amd64.outputs.download-path }}/steampipe_sqlite_${{ env.PLUGIN_NAME }}.linux_amd64.tar.gz
            ${{ steps.download_sqlite_linux_arm64.outputs.download-path }}/steampipe_sqlite_${{ env.PLUGIN_NAME }}.linux_arm64.tar.gz

            ${{ steps.download_export_darwin_amd64.outputs.download-path }}/steampipe_export_${{ env.PLUGIN_NAME }}.darwin_amd64.tar.gz
            ${{ steps.download_export_darwin_arm64.outputs.download-path }}/steampipe_export_${{ env.PLUGIN_NAME }}.darwin_arm64.tar.gz
            ${{ steps.download_export_linux_amd64.outputs.download-path }}/steampipe_export_${{ env.PLUGIN_NAME }}.linux_amd64.tar.gz
            ${{ steps.download_export_linux_arm64.outputs.download-path }}/steampipe_export_${{ env.PLUGIN_NAME }}.linux_arm64.tar.gz

            ${{ steps.download_osquery_linux_amd64.outputs.download-path }}/steampipe_osquery_${{ env.PLUGIN_NAME }}.linux_amd64.tar.gz
            ${{ steps.download_osquery_linux_arm64.outputs.download-path }}/steampipe_osquery_${{ env.PLUGIN_NAME }}.linux_arm64.tar.gz

  check-installation-linux:
    name: Check Installation(Linux)
    runs-on: ubuntu-22.04
    needs: build-draft-release
    steps:
      - name: Checkout install scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: turbot/steampipe-workflows
          ref: main
          path: steampipe-workflows
          persist-credentials: false

      - name: Check architecture
        run: uname -a

      - name: Set environment variables
        run: |
          plugin_name=$(echo $GITHUB_REPOSITORY | cut -d'-' -f 3)
          echo $plugin_name
          echo "PLUGIN_NAME=${plugin_name}" >> $GITHUB_ENV

      - name: Get latest version tag
        run: |-
          echo "VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
          echo "Version: ${VERSION}"

      - name: If workflow_dispatch, get version from input
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi
          echo "Version: ${VERSION}"

      - name: Install SQLite3
        run: sudo apt-get install -y sqlite3

      - name: Download and install SQLite Extension
        run: |-
          echo | TERM=xterm bash steampipe-workflows/scripts/install_sqlite.sh ${{ env.PLUGIN_NAME }} latest 2>/dev/null

      - name: Test SQLite Extension
        run: |
          echo ".load ./steampipe_sqlite_${{ env.PLUGIN_NAME }}" | sqlite3

      - name: Download and install Export Tool
        run: |-
          echo | sudo -E TERM=xterm bash steampipe-workflows/scripts/install_export.sh ${{ env.PLUGIN_NAME }} latest 2>/dev/null

      - name: Test Export Tool
        run: |
          # Define the expected output based on environment variables and inputs
          EXPECTED_OUTPUT="steampipe_export_${{ env.PLUGIN_NAME }} ${VERSION}"
          echo "Expected version output: $EXPECTED_OUTPUT"

          # Execute the command to get the actual version output
          COMMAND_OUTPUT=$(steampipe_export_${{ env.PLUGIN_NAME }} --version)
          echo "Actual command output version: $COMMAND_OUTPUT"

          # Compare the actual output with the expected output
          if [ "$COMMAND_OUTPUT" == "$EXPECTED_OUTPUT" ]; then
            echo "Version matches."
          else
            echo "Version does not match. Expected was $EXPECTED_OUTPUT, but got $COMMAND_OUTPUT."
            exit 1  # This exits the step with an error status, failing the job
          fi

  # Installs and loads the Darwin builds on a Mac before the release is
  # published: a published release is immutable, so a bad asset couldn't be
  # replaced. The files are installed as the install scripts install the
  # release assets; check-installation-linux runs the scripts themselves.
  check-darwin-arm64:
    name: Check Darwin Builds (ARM64)
    runs-on: macos-latest
    needs:
      - build-sqlite-extension-osx-arm64
      - build-export-tool
    # It only reads the build artifacts.
    permissions:
      contents: read
    steps:
      - name: Check architecture
        run: uname -a

      - name: Set environment variables
        run: |
          plugin_name=$(echo $GITHUB_REPOSITORY | cut -d'-' -f 3)
          echo $plugin_name
          echo "PLUGIN_NAME=${plugin_name}" >> $GITHUB_ENV

      - name: Get latest version tag
        run: |-
          echo "VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
          echo "Version: ${VERSION}"

      - name: If workflow_dispatch, get version from input
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi
          echo "Version: ${VERSION}"

      - name: Download the Darwin builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*.darwin_arm64.tar.gz"
          merge-multiple: true
          path: darwin-builds

      # As install_sqlite.sh installs the release asset, into the current
      # directory.
      - name: Install the SQLite extension from the build
        run: tar -xzvf "darwin-builds/steampipe_sqlite_${{ env.PLUGIN_NAME }}.darwin_arm64.tar.gz"

      # macOS's own /usr/bin/sqlite3 can't load extensions.
      - name: Install SQLite3
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install sqlite

      # The Darwin extension is cross-compiled on Linux, so this is where it's
      # first loaded on a Mac. SQLite appends .dylib, not .so, to a file name
      # without an extension on macOS, so pass the full name.
      - name: Test SQLite Extension
        run: |-
          so="./steampipe_sqlite_${{ env.PLUGIN_NAME }}.so"
          file "$so"
          otool -l "$so" | grep -A4 LC_BUILD_VERSION
          # Apple Silicon only loads signed code; the linker signs arm64 builds.
          if [ "$(uname -m)" = "arm64" ]; then
            codesign -v "$so"
          fi
          echo ".load $so" | "$(brew --prefix sqlite)/bin/sqlite3"

      # As install_export.sh installs the release asset.
      - name: Install the export tool from the build
        run: |-
          mkdir -p export
          tar -xzvf "darwin-builds/steampipe_export_${{ env.PLUGIN_NAME }}.darwin_arm64.tar.gz" -C export
          sudo install -d /usr/local/bin
          sudo install "export/steampipe_export_${{ env.PLUGIN_NAME }}" /usr/local/bin

      - name: Test Export Tool
        run: |
          # Define the expected output based on environment variables and inputs
          EXPECTED_OUTPUT="steampipe_export_${{ env.PLUGIN_NAME }} ${VERSION}"
          echo "Expected version output: $EXPECTED_OUTPUT"

          # Execute the command to get the actual version output
          COMMAND_OUTPUT=$(steampipe_export_${{ env.PLUGIN_NAME }} --version)
          echo "Actual command output version: $COMMAND_OUTPUT"

          # Compare the actual output with the expected output
          if [ "$COMMAND_OUTPUT" == "$EXPECTED_OUTPUT" ]; then
            echo "Version matches."
          else
            echo "Version does not match. Expected was $EXPECTED_OUTPUT, but got $COMMAND_OUTPUT."
            exit 1  # This exits the step with an error status, failing the job
          fi

  # Installs and loads the Darwin builds on a Mac before the release is
  # published: a published release is immutable, so a bad asset couldn't be
  # replaced. The files are installed as the install scripts install the
  # release assets; check-installation-linux runs the scripts themselves.
  check-darwin-amd64:
    name: Check Darwin Builds (AMD64)
    runs-on: macos-15-large
    needs:
      - build-sqlite-extension-osx-amd64
      - build-export-tool
    # It only reads the build artifacts.
    permissions:
      contents: read
    steps:
      - name: Check architecture
        run: uname -a

      - name: Set environment variables
        run: |
          plugin_name=$(echo $GITHUB_REPOSITORY | cut -d'-' -f 3)
          echo $plugin_name
          echo "PLUGIN_NAME=${plugin_name}" >> $GITHUB_ENV

      - name: Get latest version tag
        run: |-
          echo "VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
          echo "Version: ${VERSION}"

      - name: If workflow_dispatch, get version from input
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi
          echo "Version: ${VERSION}"

      - name: Download the Darwin builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*.darwin_amd64.tar.gz"
          merge-multiple: true
          path: darwin-builds

      # As install_sqlite.sh installs the release asset, into the current
      # directory.
      - name: Install the SQLite extension from the build
        run: tar -xzvf "darwin-builds/steampipe_sqlite_${{ env.PLUGIN_NAME }}.darwin_amd64.tar.gz"

      # macOS's own /usr/bin/sqlite3 can't load extensions.
      - name: Install SQLite3
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install sqlite

      # The Darwin extension is cross-compiled on Linux, so this is where it's
      # first loaded on a Mac. SQLite appends .dylib, not .so, to a file name
      # without an extension on macOS, so pass the full name.
      - name: Test SQLite Extension
        run: |-
          so="./steampipe_sqlite_${{ env.PLUGIN_NAME }}.so"
          file "$so"
          otool -l "$so" | grep -A4 LC_BUILD_VERSION
          # Apple Silicon only loads signed code; the linker signs arm64 builds.
          if [ "$(uname -m)" = "arm64" ]; then
            codesign -v "$so"
          fi
          echo ".load $so" | "$(brew --prefix sqlite)/bin/sqlite3"

      # As install_export.sh installs the release asset.
      - name: Install the export tool from the build
        run: |-
          mkdir -p export
          tar -xzvf "darwin-builds/steampipe_export_${{ env.PLUGIN_NAME }}.darwin_amd64.tar.gz" -C export
          sudo install -d /usr/local/bin
          sudo install "export/steampipe_export_${{ env.PLUGIN_NAME }}" /usr/local/bin

      - name: Test Export Tool
        run: |
          # Define the expected output based on environment variables and inputs
          EXPECTED_OUTPUT="steampipe_export_${{ env.PLUGIN_NAME }} ${VERSION}"
          echo "Expected version output: $EXPECTED_OUTPUT"

          # Execute the command to get the actual version output
          COMMAND_OUTPUT=$(steampipe_export_${{ env.PLUGIN_NAME }} --version)
          echo "Actual command output version: $COMMAND_OUTPUT"

          # Compare the actual output with the expected output
          if [ "$COMMAND_OUTPUT" == "$EXPECTED_OUTPUT" ]; then
            echo "Version matches."
          else
            echo "Version does not match. Expected was $EXPECTED_OUTPUT, but got $COMMAND_OUTPUT."
            exit 1  # This exits the step with an error status, failing the job
          fi

  notify-slack:
    name: Notify Slack
    runs-on: ubuntu-latest
    if: always()
    needs:
      - get-version
      - build-sqlite-extension-linux-amd64
      - build-sqlite-extension-linux-arm64
      - build-sqlite-extension-osx-amd64
      - build-sqlite-extension-osx-arm64
      - build-export-tool
      - build-osquery-extension
      - build-draft-release
      - check-installation-linux
      - check-darwin-arm64
      - check-darwin-amd64
    steps:
      - name: Set environment variables
        run: |
          plugin_name=$(echo $GITHUB_REPOSITORY | cut -d'-' -f 3)
          echo $plugin_name
          echo "PLUGIN_NAME=${plugin_name}" >> $GITHUB_ENV

      - name: Check for failures
        id: check_failures
        run: |
          failed_jobs=""

          # Check each job's status using static checks
          if [[ "${{ needs.get-version.result }}" == "failure" ]]; then
            failed_jobs="$failed_jobs\n- get-version"
          fi
          if [[ "${{ needs.build-sqlite-extension-linux-amd64.result }}" == "failure" ]]; then
            failed_jobs="$failed_jobs\n- build-sqlite-extension-linux-amd64"
          fi
          if [[ "${{ needs.build-sqlite-extension-linux-arm64.result }}" == "failure" ]]; then
            failed_jobs="$failed_jobs\n- build-sqlite-extension-linux-arm64"
          fi
          if [[ "${{ needs.build-sqlite-extension-osx-amd64.result }}" == "failure" ]]; then
            failed_jobs="$failed_jobs\n- build-sqlite-extension-osx-amd64"
          fi
          if [[ "${{ needs.build-sqlite-extension-osx-arm64.result }}" == "failure" ]]; then
            failed_jobs="$failed_jobs\n- build-sqlite-extension-osx-arm64"
          fi
          if [[ "${{ needs.build-export-tool.result }}" == "failure" ]]; then
            failed_jobs="$failed_jobs\n- build-export-tool"
          fi
          if [[ "${{ needs.build-osquery-extension.result }}" == "failure" ]]; then
            failed_jobs="$failed_jobs\n- build-osquery-extension"
          fi
          if [[ "${{ needs.build-draft-release.result }}" == "failure" ]]; then
            failed_jobs="$failed_jobs\n- build-draft-release"
          fi
          if [[ "${{ needs.check-installation-linux.result }}" == "failure" ]]; then
            failed_jobs="$failed_jobs\n- check-installation-linux"
          fi
          if [[ "${{ needs.check-darwin-arm64.result }}" == "failure" ]]; then
            failed_jobs="$failed_jobs\n- check-darwin-arm64"
          fi
          if [[ "${{ needs.check-darwin-amd64.result }}" == "failure" ]]; then
            failed_jobs="$failed_jobs\n- check-darwin-amd64"
          fi

          if [[ -n "$failed_jobs" ]]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=The following jobs failed:$failed_jobs" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=All jobs completed successfully" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack Notification
        uses: act10ns/slack@d96404edccc6d6467fc7f8134a420c851b1e9054 # v2.2.0
        with:
